services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: file:/app/api/data/archer.db
      JWT_ACCESS_SECRET: docker-development-secret-change-me-please-32-chars
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      CORS_ORIGIN: http://localhost:5000,http://127.0.0.1:5000
    ports:
      - "5001:5001"
    volumes:
      - api-data:/app/api/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:5001/ready')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: http://localhost:5001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5000}:80"

volumes:
  api-data:
